name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Aceitar licenças do Android SDK e preparar SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Ler versão do aplicativo
        id: app_meta
        run: |
          APP_VERSION=$(node -e "const fs=require('fs'); const m=fs.readFileSync('src/services/githubUpdateService.ts','utf8').match(/CURRENT_APP_VERSION\\s*=\\s*['\"]([^'\"]+)['\"]/); console.log(m ? m[1] : 'v1.1.0');")
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_name=${APP_VERSION#v}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${APP_VERSION}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "built_at=${BUILT_AT}" >> "$GITHUB_OUTPUT"

      - name: Compilar Web App (Vite)
        run: npm run build
        env:
          VITE_APP_URL: ${{ secrets.APP_URL || secrets.VITE_APP_URL || '' }}
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_COMMIT_SHA: ${{ github.sha }}
          VITE_APP_BUILD_NUMBER: ${{ github.run_number }}
          VITE_APP_BUILT_AT: ${{ steps.app_meta.outputs.built_at }}

      - name: Sincronizar Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilar APK direto
        id: gradle_build
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ steps.app_meta.outputs.version_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          sed -i -e 's/\r$//' gradlew || true
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

          HAS_KEYSTORE="false"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            export ANDROID_KEYSTORE_PATH="$(pwd)/app/release.keystore"
            HAS_KEYSTORE="true"
          fi

          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            echo "apk_dir=android/app/build/outputs/apk/release" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            echo "apk_dir=android/app/build/outputs/apk/debug" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### Resumo da Compilação Android (APK Direto)"
            echo "- **Assinatura:** $([ "$HAS_KEYSTORE" = "true" ] && echo "Keystore fixa configurada" || echo "Assinatura Debug padrão")"
            echo "- **Pacote Android:** \`com.vidaorganizada.app\`"
            echo "- **Armazenamento:** 100% local (Cofre Android Keystore + backup cifrado .lifeedy)"
            echo "- **Servidor opcional (IA na nuvem):** $([ -n "${{ secrets.APP_URL || secrets.VITE_APP_URL }}" ] && echo "Configurado via Secret" || echo "Opcional · OCR local no dispositivo ativo")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar APK versionado e SHA-256
        id: prep_apk
        if: ${{ steps.gradle_build.outputs.apk_dir != '' }}
        run: |
          APP_VERSION="${{ steps.app_meta.outputs.app_version }}"
          RELEASE_TAG="${{ steps.app_meta.outputs.release_tag }}"
          APK_DIR="${{ steps.gradle_build.outputs.apk_dir }}"
          APK_SOURCE=$(find "$APK_DIR" -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)
          APK_DEST="${APK_DIR}/Lifeedy-${RELEASE_TAG}.apk"
          if [ -n "$APK_SOURCE" ] && [ "$APK_SOURCE" != "$APK_DEST" ]; then
            cp "$APK_SOURCE" "$APK_DEST"
          fi
          SHA256=$(sha256sum "$APK_DEST" | awk '{print $1}')
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${APK_DEST}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Salvar APK como Artefato
        if: ${{ steps.prep_apk.outputs.apk_path != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: Lifeedy-APK
          path: ${{ steps.prep_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publicar APK como Release no GitHub
        if: ${{ steps.prep_apk.outputs.apk_path != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.prep_apk.outputs.release_tag }}"
          APK_FILE="${{ steps.prep_apk.outputs.apk_path }}"
          SHA256="${{ steps.prep_apk.outputs.apk_sha256 }}"
          NOTES="APK gerado automaticamente pelo GitHub Actions no commit ${{ github.sha }}.\n\nAtualizável diretamente por cima da versão instalada sem desinstalar.\n\nSHA-256: \`${SHA256}\`"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" \
              --title "Lifeedy ${{ steps.prep_apk.outputs.app_version }} (Build #${{ github.run_number }})" \
              --notes "$(printf '%b' "$NOTES")"
          fi
