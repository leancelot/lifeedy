name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Aceitar licenças do Android SDK e preparar SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Preparar configuração do Firebase se ausente
        run: |
          if [ ! -f "firebase-applet-config.json" ] && [ -f "firebase-applet-config.example.json" ]; then
            cp firebase-applet-config.example.json firebase-applet-config.json
          fi

      - name: Compilar Web App (Vite)
        run: npm run build
        env:
          VITE_APP_URL: ${{ secrets.APP_URL || '' }}
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_COMMIT_SHA: ${{ github.sha }}
          VITE_APP_BUILD_NUMBER: ${{ github.run_number }}

      - name: Sincronizar Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilar APK com Gradle
        run: |
          cd android
          # Corrige possíveis quebras de linha CRLF do Windows no script gradlew
          sed -i -e 's/\r$//' gradlew || true
          chmod +x gradlew
          # Aponta explicitamente para o SDK Android do runner
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar APK versionado para distribuição
        id: prep_apk
        run: |
          APP_VERSION=$(node -e "const fs=require('fs'); const m=fs.readFileSync('src/services/githubUpdateService.ts','utf8').match(/CURRENT_APP_VERSION\\s*=\\s*['\"]([^'\"]+)['\"]/); console.log(m ? m[1] : 'v1.1.0');")
          RELEASE_TAG="${APP_VERSION}-build.${{ github.run_number }}"
          APK_SOURCE=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          APK_DEST="android/app/build/outputs/apk/debug/Lifeedy-${RELEASE_TAG}.apk"
          if [ -n "$APK_SOURCE" ] && [ "$APK_SOURCE" != "$APK_DEST" ]; then
            cp "$APK_SOURCE" "$APK_DEST"
          fi
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${APK_DEST}" >> "$GITHUB_OUTPUT"

      - name: Salvar APK como Artefato para Download
        uses: actions/upload-artifact@v5
        with:
          name: Lifeedy-APK
          path: ${{ steps.prep_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publicar APK como Release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.prep_apk.outputs.release_tag }}"
          APK_FILE="${{ steps.prep_apk.outputs.apk_path }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" \
              --title "Lifeedy ${{ steps.prep_apk.outputs.app_version }} (Build #${{ github.run_number }})" \
              --notes "APK gerado automaticamente pelo GitHub Actions no commit ${{ github.sha }}."
          fi
